# Render Blueprint — https://render.com/docs/blueprint-spec
#
# Deploys the API and the generation worker as two separate services from
# the two Dockerfiles already built and CI-tested in this repo
# (Dockerfile, Dockerfile.worker — PHASE_19/20), rather than duplicating
# their build steps here. MongoDB (Atlas) and Redis are NOT defined as
# Render-managed resources — this project's docs (STORAGE.md, DATABASE.md)
# assume Atlas specifically (for its replica-set-by-default support,
# required for the transactions PHASE_06 added), and Render's own managed
# Redis works fine as an external REDIS_URL here too, so both are treated
# as pre-existing external services you point this Blueprint at, not
# something it provisions for you.
#
# Usage: in the Render dashboard, "New +" -> "Blueprint", point it at this
# repo. Render will read this file and propose both services below.
# Every envVar marked `sync: false` must be filled in manually in the
# Render dashboard after the blueprint creates the services — none of
# those values should ever be committed to this file or the repo.

services:
  - type: web
    name: novaframe-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: starter
    region: oregon
    healthCheckPath: /api/v1/health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      # --- Secrets: fill in manually in the Render dashboard, never here ---
      - key: MONGODB_URI
        sync: false
      - key: REDIS_URL
        sync: false
      - key: JWT_SECRET
        sync: false # 32+ random chars — env.js refuses to start without this (PHASE_00)
      - key: JWT_REFRESH_SECRET
        sync: false # must differ from JWT_SECRET — env.js checks this explicitly
      - key: FRONTEND_URL
        sync: false # exact Vercel production origin — used for CORS (PHASE_01) and cookie sameSite behavior (PHASE_03)
      - key: STORAGE_PROVIDER
        value: s3 # env.js refuses "local" in production (PHASE_07)
      - key: STORAGE_BUCKET
        sync: false
      - key: STORAGE_ACCESS_KEY
        sync: false
      - key: STORAGE_SECRET_KEY
        sync: false
      - key: STORAGE_REGION
        sync: false
      - key: STORAGE_ENDPOINT
        sync: false # only needed for a non-AWS S3-compatible provider (R2/B2/MinIO) — see STORAGE.md
      - key: PAYMENT_PROVIDER
        value: stripe # env.js refuses "dev-stub" in production (PHASE_13)
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false # from the specific webhook endpoint registered in the Stripe dashboard — see BILLING.md
      - key: EMAIL_PROVIDER
        value: smtp # env.js refuses "dev-stub" in production (PHASE_03)
      - key: SMTP_HOST
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: METRICS_TOKEN
        sync: false # env.js refuses to start without this in production (PHASE_17)

  - type: worker
    name: novaframe-worker
    runtime: docker
    dockerfilePath: ./Dockerfile.worker
    dockerContext: .
    plan: starter
    region: oregon
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      # Same secrets as the API service — a worker needs the same DB/
      # storage/email config to do its job. Render doesn't support
      # sharing envVars between services in a Blueprint without an env
      # group, so these are set independently; consider a Render env
      # group if keeping them in sync manually becomes error-prone.
      - key: MONGODB_URI
        sync: false
      - key: REDIS_URL
        sync: false
      - key: STORAGE_PROVIDER
        value: s3
      - key: STORAGE_BUCKET
        sync: false
      - key: STORAGE_ACCESS_KEY
        sync: false
      - key: STORAGE_SECRET_KEY
        sync: false
      - key: STORAGE_REGION
        sync: false
      - key: STORAGE_ENDPOINT
        sync: false
      # Wan GPU adapter — leave WAN_ADAPTER_ENABLED=false here. This
      # worker service (Dockerfile.worker) is deliberately NOT CUDA-
      # enabled (see docs/DOCKER.md) — it correctly runs the mock adapter
      # only. A real GPU-backed worker is PHASE_23's separate deployment,
      # not this service.
      - key: WAN_ADAPTER_ENABLED
        value: false
